<html lang="el">
<head>

<title>Μόλα 76ου Σ.Π. Στροβόλου 2026-2027</title>
<style>
:root{--gold:#8F6B00;--green:#3D5F26;--red:#900000;--blue:#15558F;--sch:#37145A;--gen:#4E1F78;--nat:#5A5A5A;--camp:#0A5A5A;--badge:#5E2A08;--bd:#dcdcd6;--mut:#6b6b66}
*{box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1c1c1a;margin:0;background:#e9efe6;font-size:13px}
header{padding:14px 18px;background:#f4f8f1;border-bottom:2px solid #3D5F26;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0 0 8px;font-weight:600;color:#2b3a1c}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl{font-size:12px;color:var(--mut);font-weight:500;margin-right:2px}
.sep{width:1px;height:16px;background:var(--bd);margin:0 4px;display:inline-block}
.btn{padding:5px 11px;border:1px solid var(--bd);border-radius:7px;background:#fff;cursor:pointer;font-size:12px}
.btn:hover{background:#f0efe9}
.btn.act{background:#1c1c1a;color:#fff;border-color:#1c1c1a}
.btn.pri{background:var(--gen);color:#fff;border-color:var(--gen)}
.count{margin-left:auto;color:var(--mut);font-size:12px}
main{display:flex;gap:0;align-items:flex-start}
aside{width:210px;flex:none;padding:12px;position:sticky;top:80px;max-height:calc(100vh - 80px);overflow:auto;border-right:1px solid var(--bd);background:#f4f8f1}
.cat{margin:0 0 3px}
.catline{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;cursor:pointer}
.catline:hover{background:#efeee8}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.catname{flex:1;font-weight:500}
.catn{color:var(--mut);font-size:11px}
.exp{cursor:pointer;color:var(--mut);width:14px;text-align:center;user-select:none}
.subs{margin:0 0 4px 22px}
.subline{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:5px;cursor:pointer;font-size:12px;color:#333}
.subline:hover{background:#efeee8}
.wrap{flex:1;padding:12px 16px;overflow:auto}
.month{margin:0 0 10px}
.mlabel{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.03em;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 7px;min-height:52px}
.cd{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:#111;margin:0 0 3px}
.addb{border:none;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.addb:hover{color:var(--blue)}
.ent{display:flex;gap:5px;align-items:flex-start;font-size:12px;line-height:1.3;padding:1px 0}
.ent.off .lab{opacity:.32;text-decoration:line-through}
.ent input{margin:2px 0 0;flex:none}
.lab{cursor:pointer;flex:1}
.chip{font-size:9px;padding:0 4px;border:1px solid;border-radius:8px;margin-left:3px;white-space:nowrap;vertical-align:1px}
.pen{cursor:pointer;color:var(--mut);font-size:12px;padding:0 2px;visibility:hidden}
body.edit .pen{visibility:visible}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:18px;width:420px;max-width:92vw;max-height:88vh;overflow:auto}
.box h3{margin:0 0 10px;font-size:15px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;font-size:12px;color:#fff}
.tag b{cursor:pointer;font-weight:400}
select,input[type=text]{padding:5px 7px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:inherit}
.hint{color:var(--mut);font-size:11px;margin:2px 0 8px}
@media print{
 header .row,aside,.addb,.pen,.actions{display:none!important}
 header{position:static;border:none}aside{display:none}
 .ent.off{display:none}.ent input{display:none}
 body{background:#fff;font-size:10px}.wrap{padding:0}
 .grid{gap:3px}.cell{min-height:40px}
 @page{size:A4 landscape;margin:10mm}
}
</style>

function entRow(e){
 const row=document.createElement('div');row.className='ent'+(selected(e)?'':' off');
 const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected(e);
 cb.onchange=()=>{if(cb.checked)delete ST.off[e.id];else ST.off[e.id]=1;save()};
 const lab=document.createElement('span');lab.className='lab';lab.style.color=mainColor(e);if(isBold(e))lab.style.fontWeight='600';lab.style.fontSize=sizeFor(e)+'px';

 tagsOf(e).forEach(tg=>{const[mm,ss]=tg.split(':');const ch=document.createElement('span');ch.className='chip';ch.style.color=MAINS[mm].c;ch.style.borderColor=MAINS[mm].c;ch.textContent=mm+(ss&&ss!=='—'?'·'+ss:'');lab.appendChild(ch)});

 row.appendChild(cb);row.appendChild(lab);row.appendChild(pen);
 return row;
}

function delEntry(e){ST.added=ST.added.filter(x=>x.id!==e.id);delete ST.tags[e.id];delete ST.off[e.id];save()}
function selAll(v){eachEntry(e=>{if(v)delete ST.off[e.id];else ST.off[e.id]=1});save()}
function setPreset(p){
 if(p==='custom'){}
 else if(p==='all'){ORDER.forEach(m=>{ST.fMain[m]=true;MAINS[m].subs.forEach(s=>ST.fSub[m+':'+s]=true)})}
 else{ORDER.forEach(m=>{ST.fMain[m]=false;MAINS[m].subs.forEach(s=>ST.fSub[m+':'+s]=true)});
  ['ΣΥΣΤΗΜΑ','ΑΡΓΙΕΣ','ΣΧΟΛΕΣ','ΓΕΝΙΚΗ','ΕΠΑΡΧΙΑ',p].forEach(m=>ST.fMain[m]=true);
  ['ΣΧΟΛΕΣ','ΓΕΝΙΚΗ','ΕΠΑΡΧΙΑ'].forEach(mm=>{MAINS[mm].subs.forEach(s=>ST.fSub[mm+':'+s]=(s===p||s==='Σημαντικά'))});}
 ST.preset=p;document.querySelectorAll('header .btn[data-p]').forEach(b=>b.classList.toggle('act',b.dataset.p===p));
 save();
}
function markCustom(){ST.preset='custom';document.querySelectorAll('header .btn[data-p]').forEach(b=>b.classList.toggle('act',b.dataset.p==='custom'))}
function updCount(){let sel=0,vis=0;eachEntry(e=>{if(visible(e)){vis++;if(selected(e))sel++}});document.getElementById('count').textContent=sel+' επιλεγμένες / '+vis+' ορατές';}
function save(){saveST();renderFilters();renderGrid();updCount()}
document.querySelectorAll('header .btn[data-p]').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
document.querySelectorAll('header .btn.src').forEach(b=>b.onclick=()=>{ST.src=b.dataset.s;document.querySelectorAll('header .btn.src').forEach(x=>x.classList.toggle('act',x===b));save()});
document.getElementById('editBtn').onclick=function(){ST.edit=!ST.edit;document.body.classList.toggle('edit',ST.edit);this.classList.toggle('act',ST.edit)};
function molaXlsx(){
 if(typeof XLSX==='undefined'){alert('Χρειάζεται σύνδεση internet για την εξαγωγή Excel.');return}
 const vals=[],sty=[],merges=[];let r=0;
 const push=(vrow,srow)=>{vals.push(vrow);sty.push(srow)};
 BASE.forEach((m,mi)=>{
  const sats=m.sats.map((s,si)=>({date:s.date,ents:s.entries.concat(ST.added.filter(x=>x.mi===mi&&x.si===si)).filter(e=>selected(e)&&visible(e))}));
  const maxN=Math.max(0,...sats.map(s=>s.ents.length));
  const vr=[m.label],sr=[{font:{bold:true,sz:11},alignment:{vertical:'top',wrapText:true}}];
  sats.forEach(s=>{vr.push(s.date||'');sr.push({font:{bold:true,sz:11,color:{rgb:'111111'}},alignment:{vertical:'top'}})});
  push(vr,sr);
  for(let k=0;k<maxN;k++){
   const vv=[''],ss=[{}];
   sats.forEach(s=>{const e=s.ents[k];if(e){const b=isBold(e);vv.push(e.t);ss.push({font:{sz:b?11:10,bold:b,color:{rgb:mainColor(e).replace('#','')}},alignment:{vertical:'top',wrapText:true}})}else{vv.push('');ss.push({})}});
   push(vv,ss);
  }
  const block=1+maxN;if(block>1)merges.push({s:{r:r,c:0},e:{r:r+block-1,c:0}});r+=block;
 });
 const ws=XLSX.utils.aoa_to_sheet(vals);
 for(let ri=0;ri<sty.length;ri++)for(let ci=0;ci<sty[ri].length;ci++){const a=XLSX.utils.encode_cell({r:ri,c:ci});if(ws[a])ws[a].s=sty[ri][ci]}
 ws['!merges']=merges;ws['!cols']=[{wch:12},{wch:22},{wch:22},{wch:22},{wch:22},{wch:22}];
 ws['!pageSetup']={orientation:'landscape',fitToWidth:1};
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Μόλα');
 XLSX.writeFile(wb,'Μόλα 76 2026-2027 (επιλογή).xlsx');
}
function expJSON(){const blob=new Blob([JSON.stringify(ST)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mola_epilogi.json';a.click()}
function impJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{ST=Object.assign({tags:{},off:{},added:[],fMain:{},fSub:{}},JSON.parse(r.result));save()}catch(e){alert('Μη έγκυρο αρχείο')}};r.readAsText(f)}
function resetAll(){if(confirm('Επαναφορά όλων των επιλογών/κατηγοριών;')){localStorage.removeItem(LSK);location.reload()}}
if(ST.edit){document.body.classList.add('edit');document.getElementById('editBtn').classList.add('act')}
if(ST.preset){document.querySelectorAll('header .btn[data-p]').forEach(b=>b.classList.toggle('act',b.dataset.p===ST.preset))}
if(TEAM!=='admin'&&!ST.preset){ST.src='all';setPreset(TEAM)}
if(TEAM!=='admin'){['ΣΥΣΤΗΜΑ','ΑΡΓΙΕΣ'].forEach(m=>{ST.fMain[m]=true;MAINS[m].subs.forEach(s=>ST.fSub[m+':'+s]=true)})}
if(API_URL&&API_URL.indexOf("__")<0)forceRead();
try{document.getElementById('teamTag').textContent=' — '+(TEAM==='admin'?'Διαχειριστής':'Τμήμα '+TEAM)}catch(e){}
if(TEAM!=='admin'){var _at=document.getElementById('adminTools');if(_at)_at.style.display='none'}
save();
function setStatus(t){var el=document.getElementById('saveStatus');if(el)el.textContent=t}
function forceRead(){
 if(!API_URL||API_URL.indexOf('__')>=0){setStatus('⚠ Όρισε το API_URL στο αρχείο');return;}
 setStatus('Ανάγνωση…');
 window.__molaCb=function(resp){try{
   var all=(resp&&resp.states)||{};
   var mine=all[TEAM];if(mine){try{var s=JSON.parse(mine);['tags','off','added','fMain','fSub','src','preset'].forEach(function(k){if(s[k]!==undefined)ST[k]=s[k]})}catch(e){}}
   EXTRA=[];if(TEAM==='admin'){Object.keys(all).forEach(function(tm){if(tm==='admin')return;try{var st=JSON.parse(all[tm]);(st.added||[]).forEach(function(x){x.owner=tm;x.fromTeam=true;EXTRA.push(x)})}catch(e){}})}
   setStatus('Ενημερώθηκε ✓ '+new Date().toLocaleTimeString());save();
 }catch(e){setStatus('Σφάλμα ανάγνωσης')}};
 var s=document.createElement('script');s.src=API_URL+(API_URL.indexOf('?')>=0?'&':'?')+'callback=__molaCb&_='+Date.now();s.onerror=function(){setStatus('Σφάλμα σύνδεσης με τη βάση')};document.body.appendChild(s);setTimeout(function(){try{s.remove()}catch(e){}},9000);
}
function forceWrite(){
 if(!API_URL||API_URL.indexOf('__')>=0){setStatus('⚠ Όρισε το API_URL στο αρχείο');return;}
 setStatus('Αποθήκευση…');
 var payload=JSON.stringify({team:TEAM,state:{tags:ST.tags,off:ST.off,added:ST.added,fMain:ST.fMain,fSub:ST.fSub,src:ST.src,preset:ST.preset}});
 fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload}).then(function(){setStatus('Στάλθηκε ✓ — κάνε Force read για επιβεβαίωση')}).catch(function(){setStatus('Σφάλμα αποθήκευσης')});
}
</script>
